name: smoketest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoketest:
    name: smoke (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is the fast/cheap path; Windows confirms cross-platform claim.
        # macOS skipped for now -- adds ~5min queue time without catching anything
        # ubuntu doesn't, and the user dev'd this on Windows so the Windows job
        # gives us the higher-signal cross-platform check.
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ffmpeg is the only non-Python binary the pipeline needs. The Python
      # side (mcp<2, faster-whisper + av<19, Pillow, pytest, ...) comes from
      # the mcp-server extras below, the same install the docs give users.
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Verify ffmpeg is on PATH
        run: ffmpeg -version | head -n 1
        shell: bash

      # Catches syntax errors / import-time failures in any script without
      # actually running the pipeline. A glob, so a new script cannot be missed.
      - name: py_compile every script
        run: python -m py_compile scripts/*.py mcp-server/server.py
        shell: bash

      - name: Install mcp-server with full + test extras
        run: python -m pip install -e "mcp-server[full,test]"
        shell: bash

      # Unit tests for the MCP server (integration tests stay opt-in).
      - name: Run mcp-server pytest
        working-directory: mcp-server
        run: python -m pytest -q
        shell: bash

      # The real smoke test: generates a synthetic 5s video, runs the
      # orchestrator end-to-end (--no-audio), asserts artifacts + meta.json
      # fields look right. Exits 0 on pass.
      - name: Run smoketest.py
        run: python scripts/smoketest.py
        shell: bash

      # Whisper weights for the audio smoke (tiny.en, ~75 MB).
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-tiny.en

      # Audio smoke: 10 s generated clip with a sine track, real local
      # transcription. Catches dependency breaks like PyAV 19 vs
      # faster-whisper (`metadata_errors`) that --no-audio never touches.
      - name: Run smoketest.py with audio (tiny.en)
        run: python scripts/smoketest.py --audio-model tiny.en
        shell: bash
